<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portafolio Fotográfico Artístico | Studio M&M</title>

  <meta name="description" content="Portafolio fotográfico artístico de Studio M&M. Paisajes, fauna, fotografía urbana y naturaleza capturados entre Chile y Canadá.">
  <meta name="keywords" content="fotografía artística, portafolio fotográfico, paisajes, fauna, Chile, Canadá">
  <meta name="author" content="Studio M&M">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Open Graph -->
  <meta property="og:title" content="Portafolio Fotográfico Artístico | Studio M&M">
  <meta property="og:description" content="Explora nuestro portafolio artístico: paisajes, fauna y fotografía urbana entre Chile y Canadá.">
  <meta property="og:image" content="https://studiomm.languageartlife.com/assets/img/mm_studio.png">
  <meta property="og:type" content="website">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- GLightbox -->
  <link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/portfolio.css">
</head>

<body>
    <section class="portfolio-hero">
        <div class="container text-center">
          <h1>Portafolio Fotográfico Artístico</h1>
          <p class="lead">
            Una exploración visual entre luz, naturaleza y territorio.  
            Fotografías capturadas entre <strong>Chile y Canadá</strong>.
          </p>
        </div>
      </section>
      <section class="portfolio-section">
        <div class="container">
      
          <div class="portfolio-filters text-center mb-5">
            <button class="filter-btn active" data-filter="*">Destacadas</button>
            <button class="filter-btn" data-filter=".paisajes">Paisajes</button>
            <button class="filter-btn" data-filter=".fauna">Fauna</button>
            <button class="filter-btn" data-filter=".urbano">Urbano</button>
            <button class="filter-btn" data-filter=".estaciones">Estaciones</button>
            <button class="filter-btn" data-filter=".nocturnas">Nocturnas</button>
          </div>
          <div class="grid">

            <!-- DESTACADA -->
            <div class="grid-item paisajes destacadas">
              <a href="assets/img/portfolio/IMG_3414.jpg"
                 class="glightbox"
                 data-gallery="portfolio"
                 data-title="Torres del Paine – Patagonia Chilena">
                <img src="assets/img/portfolio/IMG_3414.jpg"
                     loading="lazy"
                     alt="Torres del Paine al amanecer, Patagonia Chilena">
                <div class="overlay">
                  <h3>Torres del Paine</h3>
                  <span>Patagonia · Chile</span>
                </div>
              </a>
            </div>
          
            <!-- FAUNA -->
            <div class="grid-item fauna invierno">
              <a href="assets/img/portfolio/IMG_0057.jpeg"
                 class="glightbox"
                 data-gallery="portfolio"
                 data-title="Lobos en la nieve – Parque Omega, Canadá">
                <img src="assets/img/portfolio/IMG_0057.jpeg"
                     loading="lazy"
                     alt="Lobos en la nieve en Parque Omega, Canadá">
                <div class="overlay">
                  <h3>Lobos en la nieve</h3>
                  <span>Parque Omega · Canadá</span>
                </div>
              </a>
            </div>
          
            <!-- URBANO -->
            <div class="grid-item urbano">
              <a href="assets/img/portfolio/notredame-ottawa.jpeg"
                 class="glightbox"
                 data-gallery="portfolio">
                <img src="assets/img/portfolio/notredame-ottawa.jpeg"
                     loading="lazy"
                     alt="Notre-Dame de Ottawa al atardecer">
                <div class="overlay">
                  <h3>Notre-Dame</h3>
                  <span>Ottawa · Canadá</span>
                </div>
              </a>
            </div>
          
            <!-- ESTACIONES -->
            <div class="grid-item estaciones">
              <a href="assets/img/portfolio/20231001_160538.JPG"
                 class="glightbox"
                 data-gallery="portfolio">
                <img src="assets/img/portfolio/20231001_160538.JPG"
                     loading="lazy"
                     alt="Colores de otoño en Sherbrooke, Canadá">
                <div class="overlay">
                  <h3>Otoño</h3>
                  <span>Sherbrooke · Canadá</span>
                </div>
              </a>
            </div>
          
          </div>
          </div>
          </section>
          <script src="https://cdn.jsdelivr.net/npm/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
          
          <script>
            const iso = new Isotope('.grid', {
              itemSelector: '.grid-item',
              layoutMode: 'masonry',
              percentPosition: true
            });
          
            document.querySelectorAll('.filter-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                document.querySelector('.filter-btn.active').classList.remove('active');
                btn.classList.add('active');
                iso.arrange({ filter: btn.dataset.filter });
              });
            });
          
            GLightbox({
              selector: '.glightbox',
              touchNavigation: true,
              loop: true
            });
          </script>
          </body>
          </html>
